<!doctype html>
<html lang="es">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/tailwind.generated.css" />
    <title>Galería | IESTP Huanta</title>
  </head>
  <body class="bg-[#fbfcfa] text-ink">
    <header class="border-b border-slate-200 bg-white">

        <a href="../index.html" class="flex items-center gap-3 text-navy" aria-label="Ir al inicio">
          <span class="grid size-11 place-items-center rounded-xl bg-navy text-lg font-extrabold text-white">H</span>
          <span class="leading-tight">
            <strong class="block text-sm font-extrabold">IESTP Huanta</strong>
            <small class="block text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-500">Educación que transforma</small>

            <div class="absolute inset-0 bg-gradient-to-t from-navy/80 via-navy/20 to-transparent"></div>
